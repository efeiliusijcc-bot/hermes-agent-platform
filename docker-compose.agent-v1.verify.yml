name: hermes-agent-v1-verify

services:
  agent-v1-data-init:
    image: hermes-agent-v1-verify/agent-api:v1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown -R 10002:${WORKSPACE_SHARED_GID:-10003} /data/workspaces /data/artifacts &&
        chmod 2770 /data/workspaces /data/artifacts
    volumes:
      - agent-v1-workspaces:/data/workspaces
      - agent-v1-artifacts:/data/artifacts
    network_mode: none
    restart: "no"

  frontend:
    image: hermes-agent-v1-verify/frontend:v1
    ports: !override
      - "127.0.0.1:${AGENT_V1_FRONTEND_PORT:-39289}:8080"

  agent-api:
    image: hermes-agent-v1-verify/agent-api:v1
    depends_on:
      agent-v1-data-init:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:${AGENT_V1_API_PORT:-39288}:8000"
    volumes:
      - ./skills:/app/skills
      - agent-v1-workspaces:/data/workspaces
      - agent-v1-artifacts:/data/artifacts

  agent-worker:
    image: hermes-agent-v1-verify/agent-api:v1
    depends_on:
      agent-v1-data-init:
        condition: service_completed_successfully
    volumes:
      - ./skills:/app/skills:ro
      - agent-v1-workspaces:/data/workspaces
      - agent-v1-artifacts:/data/artifacts

  model-gateway:
    image: hermes-agent-v1-verify/agent-api:v1
    depends_on:
      model-stub:
        condition: service_healthy
    environment:
      MODEL_ENDPOINT: http://model-stub:8090/v1
      MODEL_API_KEY: agent-v1-contract-model-key
      MODEL_NAME: agent-v1-contract-model
      MODEL_MAX_CONCURRENCY: 2
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}

  model-stub:
    profiles: !override []
    image: hermes-agent-v1-verify/agent-api:v1

  hermes-init:
    volumes:
      - agent-v1-hermes:/opt/data
      - ./docker/hermes-init.py:/opt/bootstrap/hermes-init.py:ro

  hermes-runtime:
    volumes:
      - agent-v1-hermes:/opt/data

  mcp-gateway:
    volumes:
      - agent-v1-mcp-files:/data/files:ro

  postgres:
    volumes:
      - agent-v1-postgres:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    volumes:
      - agent-v1-redis:/data

  minio:
    volumes:
      - agent-v1-minio:/data

networks:
  platform-internal:
    name: hermes-agent-v1-verify-internal
  platform-edge:
    name: hermes-agent-v1-verify-edge

volumes:
  agent-v1-postgres:
    name: hermes-agent-v1-verify-postgres
  agent-v1-redis:
    name: hermes-agent-v1-verify-redis
  agent-v1-minio:
    name: hermes-agent-v1-verify-minio
  agent-v1-hermes:
    name: hermes-agent-v1-verify-hermes
  agent-v1-workspaces:
    name: hermes-agent-v1-verify-workspaces
  agent-v1-artifacts:
    name: hermes-agent-v1-verify-artifacts
  agent-v1-mcp-files:
    name: hermes-agent-v1-verify-mcp-files
