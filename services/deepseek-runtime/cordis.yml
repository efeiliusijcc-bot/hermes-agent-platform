# Platform-owned composition for the official DeepSeek Harness npm packages 0.1.0-rc.6.
# Keep this synchronized with the official bundled default config when upgrading.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: platform-capabilities
  name: '/opt/deepseek-harness/platform-capabilities.mjs'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    # The platform Model Gateway can route to any registered OpenAI-compatible
    # model. Disable DeepSeek-only reasoning fields for broad upstream support.
    thinking: disabled

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
