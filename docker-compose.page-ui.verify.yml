name: hermes-agent-page-ui-verify-20260814

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: hermes-agent-platform/frontend:page-ui-20260814
    restart: "no"
    ports:
      - "0.0.0.0:38389:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/frontend-health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-edge

networks:
  platform-edge:
    external: true
    name: hermes-agent-platform-edge
