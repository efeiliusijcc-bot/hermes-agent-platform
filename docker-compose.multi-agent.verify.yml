name: hermes-agent-multi-verify

services:
  frontend:
    image: hermes-agent-multi-verify/frontend:v5
    ports: !override
      - "127.0.0.1:${MULTI_AGENT_FRONTEND_PORT:-38589}:8080"

  agent-api:
    image: hermes-agent-multi-verify/agent-api:v5
    ports: !override
      - "127.0.0.1:${MULTI_AGENT_API_PORT:-38588}:8000"

  agent-worker:
    image: hermes-agent-multi-verify/agent-api:v5
    environment:
      WORKER_CONCURRENCY: 10

  hermes-orchestrator:
    image: hermes-agent-multi-verify/agent-api:v5

  model-gateway:
    image: hermes-agent-multi-verify/agent-api:v5
    environment:
      MODEL_ENDPOINT: http://model-stub:8090/v1
      MODEL_API_KEY: multi-agent-model-key
      MODEL_NAME: multi-agent-model
      MODEL_MAX_CONCURRENCY: 10
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}

  model-stub:
    profiles: !override []
    image: hermes-agent-multi-verify/agent-api:v5

  mcp-gateway:
    image: hermes-agent-multi-verify/mcp-gateway:v5

  knowledge-service:
    image: hermes-agent-multi-verify/knowledge-service:v5

networks:
  platform-internal:
    name: hermes-agent-multi-verify-internal
  platform-edge:
    name: hermes-agent-multi-verify-edge

volumes:
  phase4-postgres:
    name: hermes-agent-multi-verify-postgres
  phase4-redis:
    name: hermes-agent-multi-verify-redis
  phase4-minio:
    name: hermes-agent-multi-verify-minio
  phase4-hermes:
    name: hermes-agent-multi-verify-hermes
  phase4-workspaces:
    name: hermes-agent-multi-verify-workspaces
  phase4-artifacts:
    name: hermes-agent-multi-verify-artifacts
  phase4-mcp-files:
    name: hermes-agent-multi-verify-mcp-files
