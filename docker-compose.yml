name: hermes-agent-platform

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: hermes-agent-platform/frontend:capability-v1
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-18089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/frontend-health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-edge

  agent-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: hermes-agent-platform/agent-api:capability-v1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hermes-runtime:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      postgres-mcp:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      source-recall-gateway:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
      deepseek-runtime:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-hermes:agent-tasks:v1}
      TASK_QUEUE_POLL_SECONDS: ${TASK_QUEUE_POLL_SECONDS:-1}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_RETRY_DELAY_SECONDS: ${TASK_RETRY_DELAY_SECONDS:-1}
      TASK_STALE_SECONDS: ${TASK_STALE_SECONDS:-600}
      AGENT_MESSAGE_STREAM_KEY: ${AGENT_MESSAGE_STREAM_KEY:-hermes:agent-messages:v1}
      AGENT_MESSAGE_MAX_LENGTH: ${AGENT_MESSAGE_MAX_LENGTH:-10000}
      WORKSPACE_ROOT: /data/workspaces
      ARTIFACT_STORAGE_PROVIDER: ${ARTIFACT_STORAGE_PROVIDER:-minio}
      ARTIFACT_LOCAL_ROOT: /data/artifacts
      ARTIFACT_NAS_ROOT: /data/artifacts
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-104857600}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET:-artifacts}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: "false"
      AGENT_MEMORY_MAX_TURNS: ${AGENT_MEMORY_MAX_TURNS:-8}
      AGENT_MEMORY_TTL_SECONDS: ${AGENT_MEMORY_TTL_SECONDS:-2592000}
      AGENT_MEMORY_MAX_MESSAGE_CHARS: ${AGENT_MEMORY_MAX_MESSAGE_CHARS:-20000}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-redis}
      MEMORY_TYPE: ${MEMORY_TYPE:-short-term}
      HERMES_ENDPOINT: http://hermes-runtime:8642/v1
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      HERMES_MODEL: hermes-agent
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
      HERMES_RUNTIME_VERSION: ${HERMES_RUNTIME_VERSION:-0.20.0}
      PI_RUNTIME_ENDPOINT: ${PI_RUNTIME_ENDPOINT:-http://pi-runtime:8765}
      PI_RUNTIME_API_KEY: ${PI_RUNTIME_API_KEY:?PI_RUNTIME_API_KEY is required}
      PI_RUNTIME_TIMEOUT_SECONDS: ${PI_RUNTIME_TIMEOUT_SECONDS:-180}
      PI_RUNTIME_VERSION: ${PI_RUNTIME_VERSION:-0.84.2}
      DEEPSEEK_RUNTIME_ENDPOINT: ${DEEPSEEK_RUNTIME_ENDPOINT:-http://deepseek-runtime:8770}
      DEEPSEEK_RUNTIME_API_KEY: ${DEEPSEEK_RUNTIME_API_KEY:?DEEPSEEK_RUNTIME_API_KEY is required}
      DEEPSEEK_RUNTIME_TIMEOUT_SECONDS: ${DEEPSEEK_RUNTIME_TIMEOUT_SECONDS:-900}
      DEEPSEEK_RUNTIME_VERSION: ${DEEPSEEK_RUNTIME_VERSION:-0.1.0-rc.6}
      RUNTIME_AUTO_REGISTER: ${RUNTIME_AUTO_REGISTER:-true}
      SKILLS_ROOT: /app/skills
      SKILL_MAX_DOCUMENT_BYTES: ${SKILL_MAX_DOCUMENT_BYTES:-262144}
      SKILL_MAX_UPLOAD_BYTES: ${SKILL_MAX_UPLOAD_BYTES:-10485760}
      SKILL_MAX_EXTRACTED_BYTES: ${SKILL_MAX_EXTRACTED_BYTES:-52428800}
      SKILL_MAX_ARCHIVE_ENTRIES: ${SKILL_MAX_ARCHIVE_ENTRIES:-512}
      MCP_GATEWAY_ENDPOINT: http://mcp-gateway:8090/mcp
      MCP_GATEWAY_SIGNING_KEY: ${MCP_GATEWAY_SIGNING_KEY:?MCP_GATEWAY_SIGNING_KEY is required}
      KNOWLEDGE_SERVICE_ENDPOINT: http://knowledge-service:8081
      KNOWLEDGE_SERVICE_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_TIMEOUT_SECONDS:-60}
      KNOWLEDGE_SEARCH_TOP_K: ${KNOWLEDGE_SEARCH_TOP_K:-5}
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-10485760}
      SOURCE_RECALL_ENABLED: ${SOURCE_RECALL_ENABLED:-false}
      SOURCE_RECALL_GATEWAY_ENDPOINT: http://source-recall-gateway:8082
      SOURCE_RECALL_GATEWAY_API_KEY: ${SOURCE_RECALL_GATEWAY_API_KEY:-}
      SOURCE_RECALL_TIMEOUT_SECONDS: ${SOURCE_RECALL_TIMEOUT_SECONDS:-60}
      SOURCE_RECALL_DEFAULT_LOOKBACK_DAYS: ${SOURCE_RECALL_DEFAULT_LOOKBACK_DAYS:-3650}
      SOURCE_RECALL_DEFAULT_LIMIT: ${SOURCE_RECALL_DEFAULT_LIMIT:-20}
      SOURCE_RECALL_SUMMARY_MAX_CHARS: ${SOURCE_RECALL_SUMMARY_MAX_CHARS:-1200}
      SOURCE_RECALL_EXCERPT_MAX_CHARS: ${SOURCE_RECALL_EXCERPT_MAX_CHARS:-2000}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:?MODEL_ENDPOINT is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required}
      MODEL_REGISTRY_ENCRYPTION_KEY: ${MODEL_REGISTRY_ENCRYPTION_KEY:?MODEL_REGISTRY_ENCRYPTION_KEY is required}
      CAPABILITY_PLATFORM_ENABLED: ${CAPABILITY_PLATFORM_ENABLED:-false}
      CAPABILITY_GATEWAY_ENABLED: ${CAPABILITY_GATEWAY_ENABLED:-false}
      CONSOLE_BFF_ENABLED: ${CONSOLE_BFF_ENABLED:-false}
      LEGACY_MCP_BINDING_READ_ENABLED: ${LEGACY_MCP_BINDING_READ_ENABLED:-true}
      LEGACY_VECTOR_TOOL_ENABLED: ${LEGACY_VECTOR_TOOL_ENABLED:-true}
      PLATFORM_MANAGEMENT_API_KEY_ENABLED: ${PLATFORM_MANAGEMENT_API_KEY_ENABLED:-true}
      PLATFORM_MANAGEMENT_API_KEY: ${PLATFORM_MANAGEMENT_API_KEY:?PLATFORM_MANAGEMENT_API_KEY is required}
      CAPABILITY_GATEWAY_INTERNAL_URL: http://mcp-gateway:8090/internal/capabilities/invoke
      POSTGRES_MCP_ENDPOINT: http://postgres-mcp:8091
      EXECUTION_CAPABILITY_TOKEN_TTL_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_TTL_SECONDS:-600}
      EXECUTION_CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS:-120}
    volumes:
      - ./skills:/app/skills
      - ./data/hermes-workspace:/data/workspaces
      - ./data/artifacts:/data/artifacts
    group_add:
      - "${WORKSPACE_SHARED_GID:-10003}"
    ports:
      - "${AGENT_API_BIND_HOST:-127.0.0.1}:${AGENT_API_PORT:-18088}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal
      - platform-edge
      - pi-runtime-internal
      - deepseek-runtime-internal

  agent-worker:
    image: hermes-agent-platform/agent-api:capability-v1
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker"]
    depends_on:
      agent-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hermes-runtime:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
      source-recall-gateway:
        condition: service_healthy
      pi-runtime:
        condition: service_healthy
      deepseek-runtime:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-hermes:agent-tasks:v1}
      TASK_QUEUE_POLL_SECONDS: ${TASK_QUEUE_POLL_SECONDS:-1}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_RETRY_DELAY_SECONDS: ${TASK_RETRY_DELAY_SECONDS:-1}
      TASK_STALE_SECONDS: ${TASK_STALE_SECONDS:-600}
      AGENT_MESSAGE_STREAM_KEY: ${AGENT_MESSAGE_STREAM_KEY:-hermes:agent-messages:v1}
      AGENT_MESSAGE_MAX_LENGTH: ${AGENT_MESSAGE_MAX_LENGTH:-10000}
      WORKER_ID: ${WORKER_ID:-agent-worker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKSPACE_ROOT: /data/workspaces
      ARTIFACT_STORAGE_PROVIDER: ${ARTIFACT_STORAGE_PROVIDER:-minio}
      ARTIFACT_LOCAL_ROOT: /data/artifacts
      ARTIFACT_NAS_ROOT: /data/artifacts
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-104857600}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET:-artifacts}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SECURE: "false"
      AGENT_MEMORY_MAX_TURNS: ${AGENT_MEMORY_MAX_TURNS:-8}
      AGENT_MEMORY_TTL_SECONDS: ${AGENT_MEMORY_TTL_SECONDS:-2592000}
      AGENT_MEMORY_MAX_MESSAGE_CHARS: ${AGENT_MEMORY_MAX_MESSAGE_CHARS:-20000}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-redis}
      MEMORY_TYPE: ${MEMORY_TYPE:-short-term}
      HERMES_ENDPOINT: http://hermes-runtime:8642/v1
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      HERMES_MODEL: hermes-agent
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
      HERMES_RUNTIME_VERSION: ${HERMES_RUNTIME_VERSION:-0.20.0}
      PI_RUNTIME_ENDPOINT: ${PI_RUNTIME_ENDPOINT:-http://pi-runtime:8765}
      PI_RUNTIME_API_KEY: ${PI_RUNTIME_API_KEY:?PI_RUNTIME_API_KEY is required}
      PI_RUNTIME_TIMEOUT_SECONDS: ${PI_RUNTIME_TIMEOUT_SECONDS:-180}
      PI_RUNTIME_VERSION: ${PI_RUNTIME_VERSION:-0.84.2}
      DEEPSEEK_RUNTIME_ENDPOINT: ${DEEPSEEK_RUNTIME_ENDPOINT:-http://deepseek-runtime:8770}
      DEEPSEEK_RUNTIME_API_KEY: ${DEEPSEEK_RUNTIME_API_KEY:?DEEPSEEK_RUNTIME_API_KEY is required}
      DEEPSEEK_RUNTIME_TIMEOUT_SECONDS: ${DEEPSEEK_RUNTIME_TIMEOUT_SECONDS:-900}
      DEEPSEEK_RUNTIME_VERSION: ${DEEPSEEK_RUNTIME_VERSION:-0.1.0-rc.6}
      RUNTIME_AUTO_REGISTER: ${RUNTIME_AUTO_REGISTER:-true}
      SKILLS_ROOT: /app/skills
      SKILL_MAX_DOCUMENT_BYTES: ${SKILL_MAX_DOCUMENT_BYTES:-262144}
      SKILL_MAX_UPLOAD_BYTES: ${SKILL_MAX_UPLOAD_BYTES:-10485760}
      SKILL_MAX_EXTRACTED_BYTES: ${SKILL_MAX_EXTRACTED_BYTES:-52428800}
      SKILL_MAX_ARCHIVE_ENTRIES: ${SKILL_MAX_ARCHIVE_ENTRIES:-512}
      MCP_GATEWAY_ENDPOINT: http://mcp-gateway:8090/mcp
      MCP_GATEWAY_SIGNING_KEY: ${MCP_GATEWAY_SIGNING_KEY:?MCP_GATEWAY_SIGNING_KEY is required}
      KNOWLEDGE_SERVICE_ENDPOINT: http://knowledge-service:8081
      KNOWLEDGE_SERVICE_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_TIMEOUT_SECONDS:-60}
      KNOWLEDGE_SEARCH_TOP_K: ${KNOWLEDGE_SEARCH_TOP_K:-5}
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-10485760}
      SOURCE_RECALL_ENABLED: ${SOURCE_RECALL_ENABLED:-false}
      SOURCE_RECALL_GATEWAY_ENDPOINT: http://source-recall-gateway:8082
      SOURCE_RECALL_GATEWAY_API_KEY: ${SOURCE_RECALL_GATEWAY_API_KEY:-}
      SOURCE_RECALL_TIMEOUT_SECONDS: ${SOURCE_RECALL_TIMEOUT_SECONDS:-60}
      SOURCE_RECALL_DEFAULT_LOOKBACK_DAYS: ${SOURCE_RECALL_DEFAULT_LOOKBACK_DAYS:-3650}
      SOURCE_RECALL_DEFAULT_LIMIT: ${SOURCE_RECALL_DEFAULT_LIMIT:-20}
      SOURCE_RECALL_SUMMARY_MAX_CHARS: ${SOURCE_RECALL_SUMMARY_MAX_CHARS:-1200}
      SOURCE_RECALL_EXCERPT_MAX_CHARS: ${SOURCE_RECALL_EXCERPT_MAX_CHARS:-2000}
      CAPABILITY_PLATFORM_ENABLED: ${CAPABILITY_PLATFORM_ENABLED:-false}
      CAPABILITY_GATEWAY_ENABLED: ${CAPABILITY_GATEWAY_ENABLED:-false}
      LEGACY_MCP_BINDING_READ_ENABLED: ${LEGACY_MCP_BINDING_READ_ENABLED:-true}
      LEGACY_VECTOR_TOOL_ENABLED: ${LEGACY_VECTOR_TOOL_ENABLED:-true}
      CAPABILITY_GATEWAY_INTERNAL_URL: http://mcp-gateway:8090/internal/capabilities/invoke
      EXECUTION_CAPABILITY_TOKEN_TTL_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_TTL_SECONDS:-600}
      EXECUTION_CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS:-120}
    volumes:
      - ./skills:/app/skills:ro
      - ./data/hermes-workspace:/data/workspaces
      - ./data/artifacts:/data/artifacts
    group_add:
      - "${WORKSPACE_SHARED_GID:-10003}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; import os; assert Path('/proc/1/cmdline').exists(); assert Path('/data/workspaces').is_dir()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform-internal
      - pi-runtime-internal
      - deepseek-runtime-internal

  hermes-orchestrator:
    image: hermes-agent-platform/agent-api:phase7
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.orchestrator_worker"]
    depends_on:
      agent-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-hermes:agent-tasks:v1}
      ORCHESTRATOR_POLL_SECONDS: ${ORCHESTRATOR_POLL_SECONDS:-1}
      AGENT_MESSAGE_STREAM_KEY: ${AGENT_MESSAGE_STREAM_KEY:-hermes:agent-messages:v1}
      AGENT_MESSAGE_MAX_LENGTH: ${AGENT_MESSAGE_MAX_LENGTH:-10000}
      WORKSPACE_ROOT: /data/workspaces
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      MCP_GATEWAY_SIGNING_KEY: ${MCP_GATEWAY_SIGNING_KEY:?MCP_GATEWAY_SIGNING_KEY is required}
      PI_RUNTIME_ENDPOINT: ${PI_RUNTIME_ENDPOINT:-http://pi-runtime:8765}
      PI_RUNTIME_API_KEY: ${PI_RUNTIME_API_KEY:?PI_RUNTIME_API_KEY is required}
      PI_RUNTIME_TIMEOUT_SECONDS: ${PI_RUNTIME_TIMEOUT_SECONDS:-180}
      SOURCE_RECALL_ENABLED: ${SOURCE_RECALL_ENABLED:-false}
      SOURCE_RECALL_GATEWAY_ENDPOINT: http://source-recall-gateway:8082
      SOURCE_RECALL_GATEWAY_API_KEY: ${SOURCE_RECALL_GATEWAY_API_KEY:-}
      SOURCE_RECALL_TIMEOUT_SECONDS: ${SOURCE_RECALL_TIMEOUT_SECONDS:-60}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; assert Path('/proc/1/cmdline').exists()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform-internal

  source-recall-gateway:
    image: hermes-agent-platform/agent-api:phase7
    restart: unless-stopped
    entrypoint: ["uvicorn", "app.source_recall_gateway:app", "--host", "0.0.0.0", "--port", "8082"]
    environment:
      SOURCE_RECALL_UPSTREAM_ENDPOINT: ${SOURCE_RECALL_UPSTREAM_ENDPOINT:-}
      SOURCE_RECALL_UPSTREAM_API_KEY: ${SOURCE_RECALL_UPSTREAM_API_KEY:-}
      SOURCE_RECALL_GATEWAY_API_KEY: ${SOURCE_RECALL_GATEWAY_API_KEY:-}
      SOURCE_RECALL_UPSTREAM_TIMEOUT_SECONDS: ${SOURCE_RECALL_UPSTREAM_TIMEOUT_SECONDS:-60}
      SOURCE_RECALL_UPSTREAM_MAX_RETRIES: ${SOURCE_RECALL_UPSTREAM_MAX_RETRIES:-1}
      SOURCE_RECALL_UPSTREAM_RETRY_DELAY_SECONDS: ${SOURCE_RECALL_UPSTREAM_RETRY_DELAY_SECONDS:-0.5}
      SOURCE_RECALL_MAX_LOOKBACK_DAYS: ${SOURCE_RECALL_MAX_LOOKBACK_DAYS:-3650}
      SOURCE_RECALL_MAX_LIMIT: ${SOURCE_RECALL_MAX_LIMIT:-20}
    expose:
      - "8082"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-internal
      - platform-edge

  model-gateway:
    image: hermes-agent-platform/agent-api:phase7
    restart: unless-stopped
    entrypoint: ["uvicorn", "app.model_gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:?MODEL_ENDPOINT is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
      MODEL_REGISTRY_ENCRYPTION_KEY: ${MODEL_REGISTRY_ENCRYPTION_KEY:?MODEL_REGISTRY_ENCRYPTION_KEY is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-5}
      MODEL_QUEUE_TIMEOUT_SECONDS: ${MODEL_QUEUE_TIMEOUT_SECONDS:-60}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_DELAY_SECONDS: ${MODEL_RETRY_DELAY_SECONDS:-1}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-internal
      - pi-runtime-internal
      - deepseek-harness-internal
      - platform-edge

  model-stub:
    profiles: ["test"]
    image: hermes-agent-platform/agent-api:phase7
    restart: "no"
    entrypoint: ["uvicorn", "app.model_stub:app", "--host", "0.0.0.0", "--port", "8090"]
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks:
      - platform-internal

  hermes-init:
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    restart: "no"
    entrypoint: ["/opt/hermes/.venv/bin/python", "/opt/bootstrap/hermes-init.py"]
    environment:
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
    volumes:
      - ./data/hermes:/opt/data
      - ./docker/hermes-init.py:/opt/bootstrap/hermes-init.py:ro
    networks:
      - platform-internal

  hermes-runtime:
    build:
      context: .
      dockerfile: services/hermes-runtime/Dockerfile
    image: hermes-agent-platform/hermes-runtime:capability-v1
    restart: unless-stopped
    depends_on:
      hermes-init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    environment:
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      TERMINAL_CWD: /opt/data
      DEEPSEEK_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
      CAPABILITY_GATEWAY_ENDPOINT: http://mcp-gateway:8090/internal/capabilities/invoke
      HERMES_CAPABILITY_MAX_RESPONSE_BYTES: ${CAPABILITY_MAX_RESPONSE_BYTES:-2097152}
    command: ["gateway", "run"]
    volumes:
      - ./data/hermes:/opt/data
    expose:
      - "8642"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - platform-internal

  pi-runtime:
    build:
      context: .
      dockerfile: services/pi-runtime/Dockerfile
    image: hermes-agent-platform/pi-runtime:capability-v1
    restart: unless-stopped
    depends_on:
      model-gateway:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8765
      PI_CORE_VERSION: 0.84.2
      PI_RUNTIME_SERVICE_VERSION: 1.0.0
      PI_RUNTIME_API_KEY: ${PI_RUNTIME_API_KEY:?PI_RUNTIME_API_KEY is required}
      MODEL_GATEWAY_ENDPOINT: http://model-gateway:8080/v1
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
      MCP_GATEWAY_ENDPOINT: http://mcp-gateway:8090/mcp
      PI_RUNTIME_MAX_CONCURRENCY: ${PI_RUNTIME_MAX_CONCURRENCY:-4}
      PI_RUNTIME_QUEUE_TIMEOUT_SECONDS: ${PI_RUNTIME_QUEUE_TIMEOUT_SECONDS:-60}
      PI_RUNTIME_REQUEST_MAX_BYTES: ${PI_RUNTIME_REQUEST_MAX_BYTES:-2097152}
      PI_RUNTIME_SESSION_TTL_SECONDS: ${PI_RUNTIME_SESSION_TTL_SECONDS:-1800}
      PI_RUNTIME_MAX_SESSIONS: ${PI_RUNTIME_MAX_SESSIONS:-1000}
      PI_RUNTIME_CONTEXT_WINDOW: ${PI_RUNTIME_CONTEXT_WINDOW:-131072}
      PI_RUNTIME_MAX_OUTPUT_TOKENS: ${PI_RUNTIME_MAX_OUTPUT_TOKENS:-8192}
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8765/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - pi-runtime-internal

  deepseek-runtime:
    image: hermes-agent-platform/deepseek-runtime:capability-v1
    restart: unless-stopped
    entrypoint: ["uvicorn", "deepseek_runtime_service.gateway:app", "--host", "0.0.0.0", "--port", "8770"]
    depends_on:
      deepseek-harness-core:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    environment:
      DEEPSEEK_RUNTIME_API_KEY: ${DEEPSEEK_RUNTIME_API_KEY:?DEEPSEEK_RUNTIME_API_KEY is required}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
      DEEPSEEK_HARNESS_CORE_ENDPOINT: http://deepseek-harness-core:8771
      MODEL_GATEWAY_ENDPOINT: http://model-gateway:8080
      CAPABILITY_GATEWAY_ENDPOINT: http://mcp-gateway:8090/internal/capabilities
      DEEPSEEK_RUNTIME_REQUEST_TIMEOUT_SECONDS: ${DEEPSEEK_RUNTIME_TIMEOUT_SECONDS:-900}
      DEEPSEEK_RUNTIME_REQUEST_MAX_BYTES: ${DEEPSEEK_RUNTIME_REQUEST_MAX_BYTES:-2097152}
    expose:
      - "8770"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - deepseek-runtime-internal
      - deepseek-harness-internal
      - platform-internal

  deepseek-harness-core:
    build:
      context: .
      dockerfile: services/deepseek-runtime/Dockerfile
    image: hermes-agent-platform/deepseek-runtime:capability-v1
    restart: unless-stopped
    user: "0:0"
    environment:
      HOME: /tmp/deepseek-home
      WORKSPACE_ROOT: /data/workspaces
      DEEPSEEK_SESSION_ROOT: /data/deepseek-sessions
      MODEL_GATEWAY_ENDPOINT: http://deepseek-runtime:8770/model/v1
      CAPABILITY_GATEWAY_ENDPOINT: http://deepseek-runtime:8770/capability/invoke
      DEEPSEEK_MODEL_PROXY_TOKEN: proxy-transport-only-not-a-secret
      DEEPSEEK_HARNESS_PROVIDER: ${DEEPSEEK_HARNESS_PROVIDER:-deepseek-official}
      DEEPSEEK_HARNESS_CORDIS_CONFIG: /app/cordis.yml
      DEEPSEEK_RUNTIME_MAX_CONCURRENCY: ${DEEPSEEK_RUNTIME_MAX_CONCURRENCY:-2}
      DEEPSEEK_RUNTIME_QUEUE_TIMEOUT_SECONDS: ${DEEPSEEK_RUNTIME_QUEUE_TIMEOUT_SECONDS:-60}
      DEEPSEEK_RUNTIME_REQUEST_TIMEOUT_SECONDS: ${DEEPSEEK_RUNTIME_TIMEOUT_SECONDS:-900}
      DEEPSEEK_RUNTIME_REQUEST_MAX_BYTES: ${DEEPSEEK_RUNTIME_REQUEST_MAX_BYTES:-2097152}
      DEEPSEEK_RUNTIME_MAX_ARTIFACT_BYTES: ${DEEPSEEK_RUNTIME_MAX_ARTIFACT_BYTES:-2097152}
      DEEPSEEK_RUNTIME_SESSION_TTL_SECONDS: ${DEEPSEEK_RUNTIME_SESSION_TTL_SECONDS:-1800}
      DEEPSEEK_RUNTIME_MAX_SESSIONS: ${DEEPSEEK_RUNTIME_MAX_SESSIONS:-1000}
      DEEPSEEK_RUNTIME_MAX_OUTPUT_TOKENS: ${DEEPSEEK_RUNTIME_MAX_OUTPUT_TOKENS:-8192}
      DEEPSEEK_RUNTIME_EXECUTION_UID_MIN: ${DEEPSEEK_RUNTIME_EXECUTION_UID_MIN:-20000}
      DEEPSEEK_RUNTIME_EXECUTION_UID_MAX: ${DEEPSEEK_RUNTIME_EXECUTION_UID_MAX:-60000}
    volumes:
      - ./data/hermes-workspace:/data/workspaces
      - ./data/deepseek-sessions:/data/deepseek-sessions
    group_add:
      - "${WORKSPACE_SHARED_GID:-10003}"
    expose:
      - "8771"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8771/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - deepseek-harness-internal

  mcp-gateway:
    build:
      context: .
      dockerfile: services/mcp-gateway/Dockerfile
    image: hermes-agent-platform/mcp-gateway:capability-v1
    restart: unless-stopped
    user: "${MCP_GATEWAY_UID:-10001}:${MCP_GATEWAY_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_GATEWAY_SIGNING_KEY: ${MCP_GATEWAY_SIGNING_KEY:?MCP_GATEWAY_SIGNING_KEY is required}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-300}
      CAPABILITY_TOKEN_TTL_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_TTL_SECONDS:-600}
      CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS: ${EXECUTION_CAPABILITY_TOKEN_RENEW_BEFORE_SECONDS:-120}
      CAPABILITY_MAX_RESPONSE_BYTES: ${CAPABILITY_MAX_RESPONSE_BYTES:-2097152}
      MODEL_REGISTRY_ENCRYPTION_KEY: ${MODEL_REGISTRY_ENCRYPTION_KEY:?MODEL_REGISTRY_ENCRYPTION_KEY is required}
      MCP_FILES_ROOT: /data/files
      MCP_MAX_FILE_BYTES: ${MCP_MAX_FILE_BYTES:-262144}
      MCP_MAX_DATABASE_ROWS: ${MCP_MAX_DATABASE_ROWS:-100}
      MCP_DATABASE_STATEMENT_TIMEOUT_MS: ${MCP_DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./data/mcp-files:/data/files:ro
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection=socket.create_connection(('127.0.0.1', 8090), 2); connection.close()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal
      - pi-runtime-internal

  postgres-mcp:
    build:
      context: .
      dockerfile: services/postgres-mcp/Dockerfile
    image: hermes-agent-platform/postgres-mcp:capability-v1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_GATEWAY_SIGNING_KEY: ${MCP_GATEWAY_SIGNING_KEY:?MCP_GATEWAY_SIGNING_KEY is required}
      MODEL_REGISTRY_ENCRYPTION_KEY: ${MODEL_REGISTRY_ENCRYPTION_KEY:?MODEL_REGISTRY_ENCRYPTION_KEY is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      POSTGRES_MCP_DISCOVERY_CONCURRENCY: ${POSTGRES_MCP_DISCOVERY_CONCURRENCY:-4}
      POSTGRES_MCP_DISCOVERY_MAX_DATABASES: ${POSTGRES_MCP_DISCOVERY_MAX_DATABASES:-100}
      POSTGRES_MCP_MAX_RESPONSE_BYTES: ${POSTGRES_MCP_MAX_RESPONSE_BYTES:-2097152}
    expose:
      - "8091"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  postgres-mcp-test-db:
    profiles: ["postgres-mcp-e2e"]
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MCP_TEST_ADMIN_PASSWORD:-postgres-mcp-e2e-admin}
    volumes:
      - postgres-mcp-test-data:/var/lib/postgresql/data
      - ./tests/fixtures/postgres-mcp-init.sql:/docker-entrypoint-initdb.d/001-postgres-mcp-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - postgres-mcp-test-target

  knowledge-service:
    build:
      context: .
      dockerfile: services/knowledge-service/Dockerfile
    image: hermes-agent-platform/knowledge-service:phase7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      KNOWLEDGE_MINIO_BUCKET: knowledge
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-10485760}
      KNOWLEDGE_CHUNK_MAX_CHARS: ${KNOWLEDGE_CHUNK_MAX_CHARS:-1200}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-150}
    expose:
      - "8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/artifacts
        mc mb --ignore-existing local/knowledge
        printf 'phase1-ok' | mc pipe local/artifacts/phase1/probe.txt
    networks:
      - platform-internal

networks:
  platform-internal:
    name: ${HERMES_INTERNAL_NETWORK_NAME:-hermes-agent-platform-internal}
    internal: true
  platform-edge:
    name: ${HERMES_EDGE_NETWORK_NAME:-hermes-agent-platform-edge}
  pi-runtime-internal:
    name: ${HERMES_PI_RUNTIME_NETWORK_NAME:-hermes-agent-platform-pi-runtime}
    internal: true
  deepseek-runtime-internal:
    name: ${HERMES_DEEPSEEK_RUNTIME_NETWORK_NAME:-hermes-agent-platform-deepseek-runtime}
    internal: true
  deepseek-harness-internal:
    name: ${HERMES_DEEPSEEK_HARNESS_NETWORK_NAME:-hermes-agent-platform-deepseek-harness}
    internal: true
  postgres-mcp-test-target:
    name: ${HERMES_POSTGRES_MCP_TEST_NETWORK_NAME:-hermes-agent-platform-postgres-mcp-test-target}
    internal: true

volumes:
  postgres-mcp-test-data:
