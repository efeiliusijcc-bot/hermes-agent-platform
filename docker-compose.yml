name: hermes-agent-platform

services:
  agent-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: hermes-agent-platform/agent-api:phase3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hermes-runtime:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      HERMES_ENDPOINT: http://hermes-runtime:8642/v1
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      HERMES_MODEL: hermes-agent
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
    ports:
      - "${AGENT_API_BIND_HOST:-127.0.0.1}:${AGENT_API_PORT:-18088}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal
      - platform-edge

  model-gateway:
    image: hermes-agent-platform/agent-api:phase3
    restart: unless-stopped
    entrypoint: ["uvicorn", "app.model_gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:?MODEL_ENDPOINT is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-internal
      - platform-edge

  model-stub:
    profiles: ["test"]
    image: hermes-agent-platform/agent-api:phase3
    restart: "no"
    entrypoint: ["uvicorn", "app.model_stub:app", "--host", "0.0.0.0", "--port", "8090"]
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks:
      - platform-internal

  hermes-init:
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    restart: "no"
    entrypoint: ["/opt/hermes/.venv/bin/python", "/opt/bootstrap/hermes-init.py"]
    environment:
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required}
    volumes:
      - ./data/hermes:/opt/data
      - ./docker/hermes-init.py:/opt/bootstrap/hermes-init.py:ro
    networks:
      - platform-internal

  hermes-runtime:
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    restart: unless-stopped
    depends_on:
      hermes-init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    environment:
      HERMES_HOME: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      DEEPSEEK_API_KEY: ${MODEL_GATEWAY_API_KEY:?MODEL_GATEWAY_API_KEY is required}
    command: ["gateway", "run"]
    volumes:
      - ./data/hermes:/opt/data
      - ./data/hermes-workspace:/workspace
    expose:
      - "8642"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - platform-internal

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - platform-internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - platform-internal

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/artifacts
        mc mb --ignore-existing local/knowledge
        printf 'phase1-ok' | mc pipe local/artifacts/phase1/probe.txt
    networks:
      - platform-internal

networks:
  platform-internal:
    name: hermes-agent-platform-internal
    internal: true
  platform-edge:
    name: hermes-agent-platform-edge
